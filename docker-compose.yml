version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reading_tracker_db
    ports:
      - "5432:5432"
    # ADDED: This maps the container's data folder to a persistent volume
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Backend Service
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/reading_tracker_db

# ADDED: Declaring the named volume for Docker to manage
volumes:
  postgres_data: